function filtered(){let a=[...books()];if(S.filter!=='all')a=a.filter(b=>b.category_id===S.filter);if(S.search.trim()){const q=S.search.toLowerCase().trim();a=a.filter(b=>[b.title,b.author,b.description,getCat(b.category_id).name].join(' ').toLowerCase().includes(q))}if(S.sort==='az')a.sort((a,b)=>a.title.localeCompare(b.title));if(S.sort==='za')a.sort((a,b)=>b.title.localeCompare(a.title));if(S.sort==='fav')a=a.filter(b=>S.favs.includes(b.id));if(S.sort==='popular')a.sort((a,b)=>Number(askallBookMetric(b.id).last_7d)-Number(askallBookMetric(a.id).last_7d));return a}
function catalog(){return `<main class="wrap"><section class="page-head"><span class="eyebrow">✦ THE ASKALL COLLECTION</span><h1 class="serif">Temukan bacaanmu<span style="color:var(--green)">.</span></h1><p>Temukan, baca, dan bagikan pengetahuan.</p></section><div class="catalog-controls"><label class="search">${el('search',18)}<input id="search-input" type="search" placeholder="Cari buku, penulis, topik..." value="${esc(S.search)}" aria-label="Cari buku"></label><select id="catalog-sort" class="select" aria-label="Urutkan buku"><option value="latest" ${S.sort==='latest'?'selected':''}>Semua koleksi</option><option value="az" ${S.sort==='az'?'selected':''}>Judul A–Z</option><option value="za" ${S.sort==='za'?'selected':''}>Judul Z–A</option><option value="fav" ${S.sort==='fav'?'selected':''}>Favorit saya</option><option value="popular" ${S.sort==='popular'?'selected':''}>Terpopuler minggu ini</option></select></div><div class="chips">${[{id:'all',name:'Semua'},...cats()].map(c=>`<button class="chip ${S.filter===c.id?'active':''}" data-act="filter" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div><p class="tiny" id="result-count" style="margin-bottom:15px">${filtered().length} buku ditemukan</p><div id="book-results">${bookGrid(filtered())}</div></main>`}
function about(){return `<main class="wrap"><section class="founder-section"><div class="founder-content"><span class="eyebrow">✦ THE HEART BEHIND ASKALL</span><h2 class="serif">Sebuah perpustakaan kecil,<br><span style="color:var(--green)">dengan harapan besar.</span></h2><p>${esc(site().bio)}</p><div class="features">${site().features.map(f=>`<div class="feature">${el(f.icon,25)}<strong>${esc(f.title)}</strong><small>${esc(f.text)}</small></div>`).join('')}</div><p class="quote">${esc(site().quote)}</p><button class="btn primary" data-page="catalog">Mulai membaca ${el('arrow',16)}</button></div><div class="founder-portrait"><div class="founder-avatar">${imageSrc(site().portrait)?`<img src="${esc(imageSrc(site().portrait))}" alt="Foto pembuat">`:'MA'}</div><div class="portrait-label"><strong>${esc(site().founder)}</strong><span>${esc(site().role)}</span></div></div></section></main>`}
function footer(){return `<footer class="footer"><div class="wrap"><div class="footer-inner"><div>${logo()}<p>Ilmu yang dibagikan adalah harapan yang terus hidup. ${esc(site().name)} dibuat untuk tumbuh bersama.</p></div><div class="footer-nav"><button data-page="home">Beranda</button><button data-page="catalog">Koleksi</button><button data-page="about">Pembuat</button></div></div><div class="bottom"><span>© ${new Date().getFullYear()} ${esc(site().name)}. Made with care.</span><span>Created by ${esc(site().founder)} · ${S.visitorCount===null?"Kunjungan belum tersedia":new Intl.NumberFormat("id-ID").format(S.visitorCount)+" kunjungan tercatat"}</span></div></div></footer>`}
function navigate(page){if(page==='admin'&&!S.admin){S.modal='login';renderModal();return}S.page=page;S.mobile=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.documentElement.style.setProperty('--green',/^#[0-9a-f]{6}$/i.test(site().accent)?site().accent:'#356d5a');document.getElementById('app').innerHTML=header()+(S.page==='catalog'?catalog():S.page==='about'?about():S.page==='admin'&&S.admin?admin():home())+(S.page==='admin'?'':footer());renderModal()}
function admin(){const tabs=[['overview','grid','Dashboard'],['books','book','Kelola Buku'],['categories','layers','Kategori & Ikon'],['brand','edit','Tampilan & Profil'],['support','heart','Kunjungan & Donasi'],['online','cloud','Koneksi Online']];return `<main class="wrap admin-layout"><aside class="side"><div class="side-label">ASKALL CONTENT STUDIO</div>${tabs.map(([id,i,label])=>`<button class="${S.tab===id?'active':''}" data-act="tab" data-id="${id}">${el(i,17)} ${label}</button>`).join('')}<button data-act="logout">${el('lock',16)} Keluar Admin</button></aside><section class="admin-main"><div class="admin-header"><div><span class="eyebrow">ASKALL / CREATOR WORKSPACE</span><h1 class="serif">${({overview:'Selamat datang, Asykal.',books:'Kelola koleksi.',categories:'Kategori & ikon.',brand:'Rancang identitas.',support:'Dukungan kecil, harapan besar.',online:'Terhubung ke dunia.'})[S.tab]}</h1><p>Setiap perubahan disimpan ${S.online?'ke database online.':'pada browser demo ini.'}</p></div>${S.tab==='books'?`<button class="btn primary small" data-act="newbook">${el('plus',15)} Buku baru</button>`:''}</div>${S.tab==='overview'?dashOverview():S.tab==='books'?dashBooks():S.tab==='categories'?dashCategories():S.tab==='brand'?dashBrand():S.tab==='support'?dashSupport():dashOnline()}</section></main>`}
function dashOverview(){return `<div class="alert ${S.online?'':'warning'}">${el(S.online?'cloud':'light',17)} ${S.online?'Mode ONLINE aktif. Semua perangkat yang memakai situs terhubung akan membaca katalog yang sama.':'MODE DEMO: kamu bisa mencoba seluruh editor. Supaya pengunjung melihat perubahan, hubungkan database Supabase di menu Koneksi Online.'}</div><div class="dashboard-stats"><div class="statbox"><small>Total Buku</small><strong>${books().length}</strong></div><div class="statbox"><small>Kategori</small><strong>${cats().length}</strong></div><div class="statbox"><small>PDF siap</small><strong>${books().filter(b=>b.file_path).length}</strong></div><div class="statbox"><small>Kunjungan</small><strong>${S.visitorCount===null?"—":new Intl.NumberFormat("id-ID").format(S.visitorCount)}</strong></div></div><div class="panel" style="margin-top:18px"><h3>Aksi favoritmu</h3><div style="display:flex;gap:9px;flex-wrap:wrap"><button data-act="newbook" class="btn primary small">${el('plus',15)} Tambah Buku</button><button data-act="newcat" class="btn soft small">${el('layers',15)} Tambah Kategori</button><button data-act="tab" data-id="brand" class="btn secondary small">${el('edit',15)} Edit Profil</button><button data-act="export" class="btn secondary small">${el('download',15)} Cadangkan Data</button></div></div><div class="panel"><h3>Buku terbaru</h3>${bookRows(books().slice(0,5))}</div>`}
function bookRows(a){return `<div class="data-rows">${a.length?a.map(b=>`<div class="data-row"><div class="row-icon">${el('book',22)}</div><div class="row-body"><strong>${esc(b.title)}</strong><small>${esc(getCat(b.category_id).name)} · ${b.file_path?'PDF tersedia':'Belum ada PDF'}</small></div><div class="row-actions"><button class="icobtn" data-act="editbook" data-id="${esc(b.id)}" title="Edit buku">${el('edit',17)}</button><button class="icobtn red" data-act="delbook" data-id="${esc(b.id)}" title="Hapus buku">${el('trash',17)}</button></div></div>`).join(''):'<p class="tiny">Belum ada buku.</p>'}</div>`}
function dashBooks(){return `<div class="alert">${el('upload',17)} Cukup seret PDF dari laptop ke kolom upload. Untuk mode online, PDF akan tersimpan di cloud dan pembaca dapat membukanya tanpa Google Drive.</div><div class="panel"><h3>Daftar buku (${books().length})</h3>${bookRows(books())}</div>`}
function dashCategories(){return `<div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px"><h3 style="margin:0">Kategori bacaan</h3><button class="btn primary small" data-act="newcat">${el('plus',16)} Kategori baru</button></div><div class="data-rows">${cats().map(c=>`<div class="data-row"><div class="row-icon" style="background:${/^#[0-9a-f]{6}$/i.test(c.tone)?c.tone:'#e8f2e8'}">${el(c.icon,21)}</div><div class="row-body"><strong>${esc(c.name)}</strong><small>${books().filter(b=>b.category_id===c.id).length} buku • Ikon: ${esc(c.icon)}</small></div><div class="row-actions"><button class="icobtn" data-act="editcat" data-id="${esc(c.id)}">${el('edit',16)}</button><button class="icobtn red" data-act="delcat" data-id="${esc(c.id)}">${el('trash',16)}</button></div></div>`).join('')}</div></div><div class="alert">Ikon dan warna bisa diganti tanpa mengedit kode. Kategori yang sudah berisi buku tidak bisa dihapus sebelum bukunya dipindahkan.</div>`}
function dashBrand(){const a=site();return `<div class="panel"><h3>Identitas ASKALL</h3><form id="brand-form"><div class="fields2"><div class="field"><label>Nama perpustakaan</label><input name="name" value="${esc(a.name)}" required maxlength="60"></div><div class="field"><label>Subjudul</label><input name="subtitle" value="${esc(a.subtitle)}" maxlength="70"></div></div><div class="field"><label>Kalimat pendek di atas judul</label><input name="eyebrow" value="${esc(a.eyebrow)}" maxlength="100"></div><div class="fields2"><div class="field"><label>Judul utama, baris 1</label><input name="hero1" value="${esc(a.hero1)}" maxlength="90"></div><div class="field"><label>Judul utama, baris 2</label><input name="hero2" value="${esc(a.hero2)}" maxlength="90"></div></div><div class="field"><label>Deskripsi halaman utama</label><textarea name="description" maxlength="550">${esc(a.description)}</textarea></div><div class="fields2"><div class="field"><label>Nama pembuat</label><input name="founder" value="${esc(a.founder)}" maxlength="90"></div><div class="field"><label>Status pembuat</label><input name="role" value="${esc(a.role)}" maxlength="90"></div></div><div class="field"><label>Profil pembuat</label><textarea name="bio" maxlength="1600">${esc(a.bio)}</textarea></div><div class="field"><label>Kutipan personal</label><textarea name="quote" maxlength="350" style="min-height:65px">${esc(a.quote)}</textarea></div><div class="fields2"><div class="field"><label>Warna utama</label><input name="accent" type="color" value="${esc(a.accent)}"></div><div class="field"><label>Ikon logo</label><input type="hidden" name="logoIcon" id="brand-icon-value" value="${esc(a.logoIcon)}"><div id="logo-icons">${iconPicker(a.logoIcon,'brand-icon')}</div></div></div><div class="fields2"><div class="field"><label>Upload logo sendiri (JPG / PNG)</label><input type="file" id="brand-logo" accept="image/jpeg,image/png,image/webp"><span class="tiny">Kosongkan untuk tetap menggunakan logo lama.</span><button type="button" class="btn soft small" data-act="clear-logo" style="width:max-content">Gunakan ikon sebagai logo</button></div><div class="field"><label>Foto pembuat</label><input type="file" id="brand-portrait" accept="image/jpeg,image/png,image/webp"><span class="tiny">Gambar otomatis diperkecil agar ringan.</span></div></div><div class="divider"></div><h3>3 ikon menarik untuk halaman profil</h3><div class="profile-feat-grid">${a.features.map((f,i)=>`<div><div class="field"><label>Ikon ${i+1}</label><select name="featureIcon${i}">${ICON_NAMES.map(ic=>`<option value="${ic}" ${f.icon===ic?'selected':''}>${ic}</option>`).join('')}</select></div><div class="field"><label>Judul</label><input name="featureTitle${i}" value="${esc(f.title)}" maxlength="45"></div><div class="field"><label>Teks</label><input name="featureText${i}" value="${esc(f.text)}" maxlength="65"></div></div>`).join('')}</div><div class="form-footer"><button type="submit" class="btn primary">${el('check',16)} Simpan tampilan</button></div></form></div>`}
function dashSupport(){const a=site();const img=imageSrc(a.donationImage);return `<div class="alert">${el('heart',17)} Dukungan bersifat sukarela. Pengunjung tidak perlu membayar untuk membaca. Angka kunjungan dihitung maksimal sekali per browser per hari, bukan jumlah orang unik.</div><div class="dashboard-stats"><div class="statbox"><small>Kunjungan tercatat</small><strong>${S.visitorCount===null?'—':new Intl.NumberFormat('id-ID').format(S.visitorCount)}</strong></div><div class="statbox"><small>Status QRIS</small><strong style="font-size:17px">${a.donationEnabled&&img?'Tampil':a.donationEnabled?'Belum ada gambar':'Nonaktif'}</strong></div></div><div class="panel"><h3>Atur dukungan sukarela</h3><p class="tiny">Upload gambar QRIS resmi dari penyedia layanan pembayaran. ASKALL tidak memproses atau menyimpan informasi pembayaran pengunjung.</p><form id="donation-form"><label class="switchline"><input type="checkbox" name="donationEnabled" ${a.donationEnabled?'checked':''}>Tampilkan kartu dukungan di halaman Beranda</label><div class="field"><label>Judul dukungan</label><input name="donationTitle" maxlength="100" value="${esc(a.donationTitle||'Jika ASKALL pernah membantumu…')}"></div><div class="field"><label>Deskripsi donasi sukarela</label><textarea name="donationText" maxlength="500">${esc(a.donationText||'')}</textarea></div><div class="field"><label>Unggah QRIS resmi (PNG, JPG atau WebP)</label><input id="qris-file" type="file" accept="image/png,image/jpeg,image/webp"><span class="tiny">Gambar disimpan pada Storage ASKALL, bukan di laptop pengunjung. Jangan unggah PIN, nomor kartu, atau data pribadi lainnya.</span></div><div class="qris-preview">${img?`<img src="${esc(img)}" alt="Pratinjau QRIS ASKALL"><span class="tiny">QRIS yang sekarang digunakan.</span><button class="btn secondary small" type="button" data-act="clear-qris">Hapus gambar QRIS</button>`:`<span class="tiny">Belum ada QRIS. Upload gambar resmi supaya fitur donasi dapat ditampilkan.</span>`}</div><div class="support-note">Periksa nama penerima pada QRIS sebelum mengaktifkan. Uji scan setelah publikasi. Pengunjung bebas membaca tanpa berdonasi.</div><div class="form-footer"><button class="btn primary" type="submit">${el('check',16)} Simpan pengaturan donasi</button></div></form></div>`}
function dashOnline(){return `<div class="panel"><h3>${S.online?'Database sudah terkoneksi':'Aktifkan pembaruan otomatis ke pengunjung'}</h3><div class="alert ${S.online?'':'warning'}">${S.online?'Koleksi, kategori, PDF, dan profil ditarik dari Supabase. Perubahan dapat tampil di perangkat lain dengan koneksi internet.':'Tanpa cloud, browser pengunjung tidak akan melihat hasil editmu. Hubungkan Supabase gratis agar buku dan PDF tersimpan online.'}</div>${S.online?`<p>Proyek: <strong>${esc(S.config?.url||'')}</strong></p><p>Admin: <strong>${esc(S.user?.email||'belum login')}</strong></p><button class="btn primary" data-act="download-site">${el('download',17)} Unduh HTML online siap hosting</button><p class="tiny">Upload HTML hasil unduhan sebagai <code>index.html</code> ke Netlify. Gunakan project Supabase yang sama di semua perangkat.</p>`:`<p>1. Buat proyek di <a href="https://supabase.com/dashboard" target="_blank" rel="noopener" style="color:var(--green);text-decoration:underline">Supabase</a>.<br>2. Jalankan berkas <b>setup_supabase.sql</b> dari paket ini.<br>3. Buat akun admin Email/Password, gunakan kata sandi ASKALL123 untuk demo, lalu daftarkan UID admin di tabel admin.<br>4. Tempel Project URL dan <b>Publishable/anon key</b> di bawah. Jangan gunakan secret/service_role key.</p><form id="cloud-form"><div class="field"><label>Supabase Project URL</label><input name="url" required type="url" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable key (sb_publishable_...) atau anon key</label><textarea name="key" required placeholder="sb_publishable_..." style="min-height:72px"></textarea></div><button type="submit" class="btn primary">${el('cloud',17)} Hubungkan Supabase</button></form>`}</div><div class="panel"><h3>Penyimpanan dan keamanan</h3><p><b>PDF tidak menggunakan Google Drive.</b> Admin mengunggah file langsung ke Supabase Storage. Pengunjung hanya membaca. Gratis memiliki kuota dan batas ukuran. Kata sandi di HTML lokal hanya untuk demo. Website publik memakai Supabase Authentication + kebijakan database.</p><button class="btn secondary small" data-act="export">${el('download',16)} Cadangkan metadata JSON</button></div>`}
function iconPicker(current,action){return `<div class="icon-picker">${ICON_NAMES.slice(0,28).map(ic=>`<button type="button" class="pick-ico ${current===ic?'active':''}" title="${esc(ic)}" data-act="${action}" data-id="${ic}">${el(ic,19)}</button>`).join('')}</div>`}
function showModal(type,opt){S.modal=type;S.editBook=opt?.book||null;S.editCat=opt?.cat||null;S.selectedFile=null;S.selectedCover=null;renderModal()}
function closeModal(){S.modal='';S.selectedFile=null;S.selectedCover=null;renderModal()}
function renderModal(){const node=document.getElementById('modalroot');document.body.style.overflow=S.modal?'hidden':'';if(!S.modal){node.innerHTML='';return}let html='';if(S.modal==='support-info'){const a=site();const image=imageSrc(a.donationImage);if(!donationReady()){S.modal='';node.innerHTML='';document.body.style.overflow='';return}html=`<div class="modal askall-qris-dialog" role="dialog" aria-modal="true" aria-label="Dukungan sukarela ASKALL"><button class="close" data-act="close" aria-label="Tutup">${el('x',18)}</button><div class="modal-content"><div class="qris-icon">${el('heart',26)}</div><span class="eyebrow">A LITTLE SUPPORT, A LOT OF HOPE</span><h2 class="serif">${esc(a.donationTitle||'Jika ASKALL pernah membantumu…')}</h2><p class="qris-text">${esc(a.donationText||'Dukungan seikhlasnya sangat berarti untuk perpustakaan kecil ini.')}</p><img class="qris-image" src="${esc(image)}" alt="Gambar QRIS resmi ASKALL"><div class="qris-warning">Pastikan nama penerima sesuai sebelum berdonasi. Donasi sepenuhnya sukarela, dan semua buku tetap dapat dibaca tanpa berdonasi.</div><div class="qris-action"><a class="btn primary" href="${esc(image)}" target="_blank" rel="noopener noreferrer">${el('up',15)} Buka / Simpan QRIS</a><button class="btn secondary" data-act="close">Nanti saja</button></div></div></div>`}
else if(S.modal==='login'){html=`<div class="modal narrow"><button class="close" data-act="close">${el('x',18)}</button><div class="modal-content"><span class="eyebrow">ASKALL CONTENT STUDIO</span><h2 class="serif">Hello, creator.</h2><p>${S.online?'Masuk menggunakan akun admin Supabase. Pengunjung tidak bisa mengubah koleksi.':'Masukkan kata sandi untuk mencoba dashboard lokal.'}</p><form id="login-form">${S.online?`<div class="field"><label>Email admin</label><input name="email" type="email" autocomplete="username" required placeholder="email adminmu"></div>`:''}<div class="field"><label>Kata sandi</label><input name="password" type="password" autocomplete="${S.online?'current-password':'off'}" required placeholder="Kata sandi admin"></div><button type="submit" class="btn primary full">${el('lock',16)} Buka Dashboard</button></form><p class="tiny" style="margin-top:14px">${S.online?'Akses edit dilindungi Supabase Auth dan Row Level Security.':'ASKALL123 adalah kunci demo. Jangan menganggap kunci dalam HTML sebagai sistem keamanan untuk situs publik.'}</p></div></div>`}

nput id="book-pdf-file" type="file" accept=".pdf,application/pdf" aria-label="Pilih PDF"></div><div id="drop-selected" class="drop-selected">${b.file_path?'PDF sebelumnya tersedia. Biarkan kosong jika tidak ingin mengganti.':'Belum ada PDF dipilih.'}</div></div><div id="upload-progress" class="hide"><div class="tiny" id="upload-status">Menyimpan...</div><div class="loadbar"><div id="upload-percent"></div></div></div><div class="form-footer"><button type="button" data-act="close" class="btn secondary">Batal</button><button type="submit" class="btn primary" id="book-save">${el('check',16)} ${S.editBook?'Simpan Perubahan':'Tambah Buku'}</button></div></form></div></div>`}

function checkAdmin(){if(S.admin)return true;showModal('login');toast('Masuk admin terlebih dahulu.');return false}
function storeLocalAsset(key,blob){return new Promise((resolve,reject)=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onerror=()=>reject(rq.error);rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readwrite');t.objectStore('assets').put(blob,key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)}})}
function getLocalAsset(key){return new Promise((resolve,reject)=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onerror=()=>reject(rq.error);rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readonly');const g=t.objectStore('assets').get(key);g.onsuccess=()=>{resolve(g.result);db.close()};g.onerror=()=>reject(g.error)}})}
function deleteLocalAsset(key){return new Promise(resolve=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readwrite');t.objectStore('assets').delete(key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>{db.close();resolve()}};rq.onerror=()=>resolve()})}
function fileValid(file){return file&&(file.type==='application/pdf'||/\.pdf$/i.test(file.name))&&file.size>0&&file.size<=50*1024*1024}
async function shrink(file,width=740){return new Promise((resolve,reject)=>{if(!/^image\/(png|jpeg|webp)$/.test(file.type))return reject(Error('Gunakan JPG, PNG, atau WebP.'));const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,width/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Gambar tidak dapat disimpan.')),'image/webp',.76)};im.onerror=()=>reject(Error('Gambar tidak bisa dibuka.'));im.src=reader.result};reader.onerror=()=>reject(Error('Gambar gagal dibaca.'));reader.readAsDataURL(file)})}
const blobToData=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});
async function uploadAsset(file,prefix){if(!S.online)throw Error('Cloud belum aktif.');const path=`${prefix}/${uid()}.${prefix==='pdf'?'pdf':'webp'}`;const {error}=await S.client.storage.from('askall-library').upload(path,file,{contentType:prefix==='pdf'?'application/pdf':'image/webp',upsert:false,cacheControl:'3600'});if(error)throw error;return path}
const publicAsset=path=>{if(!path)return '';if(!S.client)return '';return S.client.storage.from('askall-library').getPublicUrl(path).data.publicUrl};
async function saveRecord(table,data){if(S.online){const {error}=await S.client.from(table).upsert(data);if(error)throw error}else{if(table==='askall_books'){S.books=[data,...books().filter(b=>b.id!==data.id)];}if(table==='askall_categories'){S.cats=[...cats().filter(c=>c.id!==data.id),data]};if(table==='askall_site'){S.settings=data.data};writeLocal()}}
async function removeRecord(table,id){if(S.online){const {error}=await S.client.from(table).delete().eq('id',id);if(error)throw error}else{if(table==='askall_books')S.books=books().filter(b=>b.id!==id);if(table==='askall_categories')S.cats=cats().filter(c=>c.id!==id);writeLocal()}}
function showLoading(value,text='Mengunggah...'){S.uploading=value;const btn=document.getElementById('book-save');if(btn)btn.disabled=value;const p=document.getElementById('upload-progress');if(p)p.classList.toggle('hide',!value);const status=document.getElementById('upload-status');if(status)status.textContent=text;const percent=document.getElementById('upload-percent');if(percent)percent.style.width=value?'65%':'0%'}
async function persistBook(form){if(!checkAdmin()||S.uploading)return;const v=Object.fromEntries(new FormData(form).entries());const b=S.editBook;const id=b?.id||uid();const book={id,title:String(v.title).trim(),author:String(v.author).trim(),category_id:String(v.category_id),description:String(v.description).trim(),year:String(v.year).trim(),tag:String(v.tag||'KOLEKSI').trim(),color:String(v.color),cover_url:b?.cover_url||'',file_path:b?.file_path||'',size:b?.size||0,created_at:b?.created_at||new Date().toISOString()};if(!book.title){toast('Judul tidak boleh kosong.');return}if(!cats().some(c=>c.id===book.category_id)){toast('Pilih kategori yang tersedia.');return}
 const files=[];showLoading(true);try{
 if(S.selectedFile){if(!fileValid(S.selectedFile))throw Error('PDF wajib berformat .pdf dan ukuran maksimal 50 MB.');book.size=S.selectedFile.size;if(S.online){book.file_path=await uploadAsset(S.selectedFile,'pdf');files.push(book.file_path)}else{book.file_path='demo/'+id;await storeLocalAsset(book.file_path,S.selectedFile)}}
 if(S.selectedCover){const shrunk=await shrink(S.selectedCover,800);if(S.online){const coverPath=await uploadAsset(shrunk,'covers');book.cover_url=publicAsset(coverPath);files.push(coverPath)}else{book.cover_url=await blobToData(shrunk)}}
 await saveRecord('askall_books',book);
 if(S.online){if(b?.file_path&&S.selectedFile&&b.file_path!==book.file_path){await S.client.storage.from('askall-library').remove([b.file_path])}if(b?.cover_url&&S.selectedCover&&b.cover_url.includes('/storage/v1/object/public/')){const oldpath=b.cover_url.split('/storage/v1/object/public/askall-library/')[1];if(oldpath)await S.client.storage.from('askall-library').remove([decodeURIComponent(oldpath)])}}
 else if(b?.file_path&&S.selectedFile&&b.file_path!==book.file_path)await deleteLocalAsset(b.file_path);
 if(S.online)await loadCloud();closeModal();render();toast('Buku berhasil disimpan'+(S.online?' dan tersedia untuk pengunjung.':'.'));
 }catch(e){toast('Gagal menyimpan: '+e.message);if(S.online&&files.length){const unused=files.filter(p=>!p.startsWith('http'));if(unused.length)await S.client.storage.from('askall-library').remove(unused)}}finally{showLoading(false)}}
async function persistCategory(form){if(!checkAdmin())return;const v=Object.fromEntries(new FormData(form).entries());const name=String(v.name||'').trim().replace(/\s+/g,' ');if(!name){toast('Isi nama kategori.');return}if(cats().some(c=>c.id!==S.editCat?.id&&c.name.toLowerCase()===name.toLowerCase())){toast('Kategori sudah ada.');return}const data={id:S.editCat?.id||uid(),name,icon:ICONS[v.icon]?v.icon:'book',tone:/^#[0-9a-f]{6}$/i.test(v.tone)?v.tone:'#e4eee3'};try{await saveRecord('askall_categories',data);if(S.online)await loadCloud();closeModal();render();toast('Kategori dan ikon tersimpan.')}catch(e){toast('Gagal menyimpan kategori: '+e.message)}}
async function encodeQRIS(file){if(!/^image\/(png|jpeg|webp)$/.test(file?.type||''))throw Error('Pilih gambar QRIS PNG, JPG, atau WebP.');if(file.size>10*1024*1024)throw Error('Ukuran gambar QRIS maksimal 10 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error('QRIS gagal diproses.')),'image/webp',1)};im.onerror=()=>reject(Error('Gambar QRIS tidak terbaca.'));im.src=r.result};r.onerror=()=>reject(Error('Gambar gagal dimuat.'));r.readAsDataURL(file)})}
async function persistDonation(form){if(!checkAdmin())return;const pickedQRIS=form.querySelector('#qris-file')?.files?.[0];if(pickedQRIS){S.selectedQRIS=pickedQRIS;S.clearQRIS=false}const v=Object.fromEntries(new FormData(form).entries());const next={...site(),donationEnabled:v.donationEnabled==='on',donationTitle:String(v.donationTitle||'').trim().slice(0,100),donationText:String(v.donationText||'').trim().slice(0,500)};let newPath='';try{if(S.clearQRIS)next.donationImage='';if(S.selectedQRIS){const img=await encodeQRIS(S.selectedQRIS);if(S.online){newPath=await uploadAsset(img,'qris');next.donationImage=publicAsset(newPath)}else{next.donationImage=await blobToData(img)}}if(next.donationEnabled&&!next.donationImage){toast('Unggah gambar QRIS dahulu, atau nonaktifkan kartu dukungan.');if(newPath)await S.client.storage.from('askall-library').remove([newPath]);return}await saveRecord('askall_site',{id:1,data:next});S.settings=next;if(S.online)await loadCloud();S.selectedQRIS=null;S.clearQRIS=false;render();toast('Pengaturan dukungan ASKALL berhasil disimpan.')}catch(e){toast('Gagal menyimpan donasi: '+e.message);if(S.online&&newPath)await S.client.storage.from('askall-library').remove([newPath])}}
async function persistBrand(form){if(!checkAdmin())return;const v=Object.fromEntries(new FormData(form).entries());let next={...site()};for(const key of ['name','subtitle','eyebrow','hero1','hero2','description','founder','role','bio','quote','accent','logoIcon'])if(Object.prototype.hasOwnProperty.call(v,key))next[key]=String(v[key]).trim();next.features=[0,1,2].map(i=>({icon:ICONS[v['featureIcon'+i]]?v['featureIcon'+i]:'heart',title:String(v['featureTitle'+i]||'').trim(),text:String(v['featureText'+i]||'').trim()}));try{if(S.selectedPortrait){const file=await shrink(S.selectedPortrait,750);next.portrait=S.online?publicAsset(await uploadAsset(file,'images')):await blobToData(file)}if(S.selectedLogo){const file=await shrink(S.selectedLogo,450);next.logoImage=S.online?publicAsset(await uploadAsset(file,'images')):await blobToData(file)}if(S.clearLogo)next.logoImage='';await saveRecord('askall_site',{id:1,data:next});S.settings=next;if(S.online)await loadCloud();S.selectedPortrait=null;S.selectedLogo=null;S.clearLogo=false;render();toast('Identitas ASKALL berhasil diperbarui.')}catch(e){toast('Gagal menyimpan tampilan: '+e.message)}}
async function deleteBook(id){if(!checkAdmin())return;const b=books().find(x=>x.id===id);if(!b||!confirm(`Hapus buku “${b.title}”?`))return;try{await removeRecord('askall_books',id);if(S.online){let paths=[];if(b.file_path)paths.push(b.file_path);if(b.cover_url?.includes('/storage/v1/object/public/askall-library/')){const name=b.cover_url.split('/storage/v1/object/public/askall-library/')[1];if(name)paths.push(decodeURIComponent(name))}if(paths.length){const {error}=await S.client.storage.from('askall-library').remove(paths);if(error)toast('Buku terhapus, tetapi sebagian berkas masih perlu dibersihkan: '+error.message)}await loadCloud()}else{if(b.file_path?.startsWith('demo/'))await deleteLocalAsset(b.file_path)}render();toast('Buku berhasil dihapus.')}catch(e){toast('Gagal menghapus: '+e.message)}}
async function deleteCategory(id){if(!checkAdmin())return;if(cats().length<=1){toast('Minimal satu kategori diperlukan.');return}if(books().some(b=>b.category_id===id)){toast('Pindahkan semua buku dalam kategori ini sebelum menghapus.');return}const c=getCat(id);if(!confirm(`Hapus kategori ${c.name}?`))return;try{await removeRecord('askall_categories',id);if(S.online)await loadCloud();if(S.filter===id)S.filter='all';render();toast('Kategori dihapus.')}catch(e){toast('Gagal menghapus kategori: '+e.message)}}
async function readPDF(id){const b=books().find(x=>x.id===id);if(!b?.file_path){toast('PDF untuk buku ini belum diunggah.');return}if(S.online){const p=publicAsset(b.file_path);if(p){window.open(p,'_blank','noopener,noreferrer');void askallRegisterRead(id)}else toast('Alamat PDF belum tersedia.');}else{try{const blob=await getLocalAsset(b.file_path);if(!blob)throw Error('File tidak ditemukan pada browser ini.');const u=URL.createObjectURL(blob);window.open(u,'_blank','noopener,noreferrer');setTimeout(()=>URL.revokeObjectURL(u),120000)}catch(e){toast(e.message)}}}
function download(name,contents,type){const blob=new Blob([contents],{type:type||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function backup(){download('ASKALL_LIBRARY_BACKUP.json',JSON.stringify({metadata:{createdAt:new Date().toISOString(),note:'Cadangan hanya berisi metadata, bukan file PDF.'},books:books(),categories:cats(),settings:site()},null,2),'application/json')}
function exportHTML(){if(!S.config?.url||!S.config?.key){toast('Hubungkan Supabase terlebih dahulu.');return}const active=document.getElementById('askall-cloud-settings');active.textContent=JSON.stringify(S.config).replace(/</g,'\\u003c');const output='<!DOCTYPE html>\n'+document.documentElement.outerHTML;download('index.html',output,'text/html;charset=utf-8');toast('HTML sudah diunduh. Upload index.html ke hosting.');}
async function loadCloud(){if(!S.online)return;const [br,cr,sr]=await Promise.all([S.client.from('askall_books').select('*').order('created_at',{ascending:false}),S.client.from('askall_categories').select('*').order('name'),S.client.from('askall_site').select('*').eq('id',1).maybeSingle()]);for(const r of [br,cr,sr])if(r.error)throw r.error;S.books=br.data||[];S.cats=cr.data||[];S.settings={...SET,...(sr.data?.data||{})};S.initialized=true;if(!S.modal&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||''))render()}
async function trackVisit(){if(!S.online||!S.client)return;try{let id=localStorage.getItem('askall-v4-anonymous-browser-id');if(!id||!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id)){id=crypto.randomUUID();localStorage.setItem('askall-v4-anonymous-browser-id',id)}const {data,error}=await S.client.rpc('askall_register_visit',{p_visitor_key:id});if(error)throw error;S.visitorCount=Number(data);if(!S.modal&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||''))render()}catch(err){console.warn('ASKALL visitor counter unavailable:',err.message)}}
async function initCloud(){if(!S.config?.url||!S.config?.key)return;try{if(!window.supabase?.createClient)throw Error('Library Supabase belum dimuat. Periksa koneksi internet.');S.client=window.supabase.createClient(S.config.url,S.config.key);S.online=true;S.admin=false;S.user=null;await loadCloud();await askallFetchReads();await trackVisit();const {data:{session}}=await S.client.auth.getSession();if(session){const {data:role}=await S.client.from('askall_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();S.admin=!!role;S.user=role?session.user:null}
S.client.channel('askall-public-updates').on('postgres_changes',{event:'*',schema:'public',table:'askall_books'},()=>loadCloud().catch(()=>{})).on('postgres_changes',{event:'*',schema:'public',table:'askall_categories'},()=>loadCloud().catch(()=>{})).on('postgres_changes',{event:'*',schema:'public',table:'askall_site'},()=>loadCloud().catch(()=>{})).subscribe();
setInterval(()=>{if(!document.hidden&&!S.modal&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||''))loadCloud().catch(()=>{})},30000);
setInterval(()=>{if(!document.hidden)void askallFetchReads()},45000);
render();toast('ASKALL terhubung ke data online.');}catch(e){S.online=false;S.client=null;S.admin=false;toast('Cloud belum tersambung: '+e.message);render()}}
async function login(form){const v=Object.fromEntries(new FormData(form).entries());if(S.online){try{const {data,error}=await S.client.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;const {data:role,error:roleError}=await S.client.from('askall_admins').select('user_id').eq('user_id',data.user.id).maybeSingle();if(roleError)throw roleError;if(!role){await S.client.auth.signOut();throw Error('Akun ini bukan admin yang terdaftar.')}S.user=data.user;S.admin=true;closeModal();S.tab='overview';navigate('admin');toast('Selamat datang di dashboard ASKALL.')}catch(e){toast('Login gagal: '+e.message)}}else{if(v.password!=='ASKALL123'){toast('Kata sandi demo salah.');form.querySelector('input[name="password"]').value='';return}S.admin=true;closeModal();S.tab='overview';navigate('admin');toast('Dashboard demo terbuka.')}}
async function connectCloud(form){if(!checkAdmin())return;const v=Object.fromEntries(new FormData(form).entries());const address=url(v.url?.trim());if(!address||!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(address)){toast('Masukkan URL proyek Supabase yang valid.');return}if(!/^sb_publishable_[\w-]+$|^eyJ[A-Za-z0-9_.-]+$/.test(String(v.key||'').trim())){toast('Publishable key atau anon key tidak valid.');return}S.config={url:address.replace(/\/$/,''),key:String(v.key).trim()};document.getElementById('askall-cloud-settings').textContent=JSON.stringify(S.config);closeModal();await initCloud();if(S.online){toast('Sekarang login admin Supabase untuk mengedit secara online.');showModal('login')}}
async function handleAction(btn,event){const act=btn.dataset.act;const id=btn.dataset.id;if(!act)return;if(act==='mobile'){S.mobile=!S.mobile;render();return}if(act==='support-open'){if(donationReady())showModal('support-info');else toast('QRIS belum diaktifkan oleh admin.');return}if(act==='admin'){if(S.admin)navigate('admin');else showModal('login');return}if(act==='close'){closeModal();return}if(act==='scrim'){if(event.target===btn)closeModal();return}if(act==='tab'){if(!checkAdmin())return;S.tab=id;render();return}if(act==='logout'){if(S.online&&S.client)await S.client.auth.signOut();S.admin=false;S.user=null;S.tab='overview';navigate('home');toast('Kamu sudah keluar dari admin.');return}if(act==='newbook'){if(checkAdmin())showModal('book');return}if(act==='editbook'){if(checkAdmin())showModal('book',{book:books().find(b=>b.id===id)});return}if(act==='delbook'){await deleteBook(id);return}if(act==='newcat'){if(checkAdmin())showModal('category');return}if(act==='editcat'){if(checkAdmin())showModal('category',{cat:cats().find(c=>c.id===id)});return}if(act==='delcat'){await deleteCategory(id);return}if(act==='cat-icon'||act==='brand-icon'){const field=document.getElementById(act==='cat-icon'?'cat-icon-value':'brand-icon-value');if(field)field.value=id;const container=btn.parentElement;container.querySelectorAll('.pick-ico').forEach(e=>e.classList.toggle('active',e===btn));return}if(act==='clear-qris'){S.clearQRIS=true;S.selectedQRIS=null;const inp=document.getElementById('qris-file');if(inp)inp.value='';toast('QRIS akan dihapus setelah menyimpan pengaturan.');return}if(act==='clear-logo'){S.clearLogo=true;S.selectedLogo=null;const inp=document.getElementById('brand-logo');if(inp)inp.value='';toast('Logo gambar akan dihapus setelah kamu klik Simpan tampilan.');return}if(act==='filter'){S.filter=id;render();return}if(act==='go-cat'){S.filter=id;S.search='';navigate('catalog');return}if(act==='detail'){S.detailId=id;S.modal='detail';renderModal();return}if(act==='fav'){event.stopPropagation();S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];localStorage.setItem('askall-ultra-favs',JSON.stringify(S.favs));render();toast(S.favs.includes(id)?'Tersimpan dalam favorit.':'Dihapus dari favorit.');return}if(act==='open-pdf'){await readPDF(id);return}if(act==='export'){backup();return}if(act==='download-site'){exportHTML();return}}
async function onSubmit(form){if(form.id==='login-form')return login(form);if(form.id==='book-form')return persistBook(form);if(form.id==='cat-form')return persistCategory(form);if(form.id==='brand-form')return persistBrand(form);if(form.id==='donation-form')return persistDonation(form);if(form.id==='cloud-form')return connectCloud(form)}
function takePDF(file){if(!file)return;if(!fileValid(file)){toast('Hanya PDF sampai 50 MB yang diterima.');return}S.selectedFile=file;const text=document.getElementById('drop-selected');if(text)text.textContent=`✓ ${file.name} (${(file.size/1024/1024).toFixed(2)} MB), siap diunggah.`}
document.addEventListener('click',event=>{const p=event.target.closest('[data-page]');if(p){event.preventDefault();navigate(p.dataset.page);return}const button=event.target.closest('[data-act]');if(button)handleAction(button,event)});
document.addEventListener('submit',event=>{if(['login-form','book-form','cat-form','brand-form','donation-form','cloud-form'].includes(event.target.id)){event.preventDefault();onSubmit(event.target)}});
document.addEventListener('input',event=>{if(event.target.id==='search-input'){S.search=event.target.value;document.getElementById('book-results').innerHTML=bookGrid(filtered());document.getElementById('result-count').textContent=filtered().length+' buku ditemukan';}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='catalog-sort'){S.sort=t.value;render()}else if(t.id==='book-pdf-file')takePDF(t.files?.[0]);else if(t.id==='book-cover-file')S.selectedCover=t.files?.[0]||null;else if(t.id==='brand-logo')S.selectedLogo=t.files?.[0]||null;else if(t.id==='brand-portrait')S.selectedPortrait=t.files?.[0]||null;else if(t.id==='qris-file'){S.selectedQRIS=t.files?.[0]||null;if(S.selectedQRIS){S.clearQRIS=false;const preview=t.closest('form')?.querySelector('.qris-preview');if(preview)preview.innerHTML='<span class="tiny">✓ Gambar QRIS siap disimpan. Klik Simpan pengaturan donasi.</span>'}}});
document.addEventListener('dragover',event=>{const zone=event.target.closest('#pdf-dropzone');if(zone){event.preventDefault();zone.classList.add('dragging')}});
document.addEventListener('dragleave',event=>{const zone=event.target.closest('#pdf-dropzone');if(zone)zone.classList.remove('dragging')});
document.addEventListener('drop',event=>{const zone=event.target.closest('#pdf-dropzone');if(zone){event.preventDefault();zone.classList.remove('dragging');takePDF(event.dataTransfer.files?.[0])}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&S.modal)closeModal()});
render();window.addEventListener('load',()=>{if(S.config)initCloud()});
})();
</script></body></html>
